# Self-hosted denarii (SPEC §13.3). From this directory:
#   cp .env.example .env    # then fill it in
#   docker compose up -d                    # denarii only, Telegram by polling
#   docker compose --profile tunnel up -d   # plus a Cloudflare Tunnel for MacroDroid

services:
  denarii:
    image: ghcr.io/guernik/denarii:${DENARII_VERSION:-latest}
    build:
      context: ..
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      # Fixed inside the container: the SQLite file lives on the volume below.
      DATABASE_PATH: /data/denarii.db
      PORT: "3000"
    ports:
      - "${DENARII_PORT:-3000}:3000"
    volumes:
      - denarii-data:/data

  cloudflared:
    image: cloudflare/cloudflared:${CLOUDFLARED_VERSION:-latest}
    profiles: [tunnel]
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - denarii

volumes:
  denarii-data:
